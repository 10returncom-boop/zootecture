<script>
var API_BASE = 'https://zootecture-api.10return-com.workers.dev'; /* 自訂網域路由設定後改為 '' */
function doSearch(){
  var q=document.getElementById('q').value.trim();
  var box=document.getElementById('results');
  if(!q){ box.innerHTML='<div class="empty">請輸入關鍵字開始搜尋。</div>'; return; }
  box.innerHTML='<div class="empty">搜尋中…</div>';
  fetch(API_BASE+'/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
    if(!d.ok){ box.innerHTML='<div class="empty">搜尋服務未上線（請確認已部署 Worker /api/search）。</div>'; return; }
    if(!d.data.length){ box.innerHTML='<div class="empty">找不到「'+q+'」相關文章。</div>'; return; }
    var h='';
    d.data.forEach(function(a){
      h+='<div class="result"><div class="cat">'+a.category+'</div>'
        +'<a href="'+a.url+'">'+a.title+'</a>'
        +'<div class="desc">'+(a.meta_desc||'')+'</div></div>';
    });
    box.innerHTML=h;
  }).catch(function(){ box.innerHTML='<div class="empty">無法連線搜尋服務（請確認已部署 Worker /api/search）。</div>'; });
}
document.getElementById('q').addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });
</script>
